<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspección de Caminos</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; background-color: #f4f4f9;}
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333;}
        input[type="text"], textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px;}
        button { width: 100%; padding: 12px; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px;}
        .btn-blue { background-color: #0056b3; }
        .btn-success { background-color: #28a745; }
        .btn-camara { background-color: #6c757d; }
        .btn-orange { background-color: #fd7e14; }
        .status { text-align: center; margin-top: 20px; padding: 10px; border-radius: 5px; background-color: #e2e3e5; color: #383d41; font-weight: bold;}
        
        #visor-camara { width: 100%; border-radius: 5px; background-color: #000; display: none; margin-bottom: 10px; }
        #galeria-miniaturas { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
        .miniatura { width: 60px; height: 60px; object-fit: cover; border-radius: 5px; border: 2px solid #0056b3; }
    </style>
</head>
<body>

    <h2 style="text-align: center; color: #333;">Registro de Inspección</h2>

    <div class="card">
        <div class="form-group">
            <label for="titulo">Punto de Inspección:</label>
            <input type="text" id="titulo" placeholder="Ej. Puente Km 45">
        </div>

        <div class="form-group">
            <label for="descripcion">Observaciones:</label>
            <textarea id="descripcion" rows="3" placeholder="Descripción..."></textarea>
        </div>

        <div class="form-group">
            <button id="btn-ubicacion" class="btn-blue">📍 Obtener Coordenadas GPS</button>
            <p id="coordenadas-texto" style="text-align: center; color: #666; font-weight: bold; margin-top: 10px;">Latitud: --- | Longitud: ---</p>
        </div>

        <div class="form-group" style="border-top: 1px solid #eee; padding-top: 15px;">
            <video id="visor-camara" autoplay playsinline muted></video>
            <canvas id="canvas-foto" style="display: none;"></canvas>
            <button id="btn-encender-camara" class="btn-camara">📷 Encender Cámara</button>
            <button id="btn-capturar-foto" style="background-color: #ffc107; color: #000; display: none;">📸 Capturar Foto</button>
            <div id="galeria-miniaturas"></div>
        </div>

        <button id="btn-guardar" class="btn-success" style="margin-top: 20px; width: 100%;">💾 Guardar Registro</button>
        
        <div style="border-top: 2px dashed #ccc; margin-top: 25px; padding-top: 15px;">
            <h3 style="text-align: center; color: #555;">Exportar Datos</h3>
            
            <button id="btn-descargar-csv" style="background-color: #17a2b8; width: 100%;">📊 Descargar Excel (CSV)</button>
            <button id="btn-compartir-kmz" class="btn-orange" style="width: 100%;">🌍 Compartir KMZ (WhatsApp/Mail)</button>
        </div>
    </div>

    <div class="status" id="estado-app">Conectando...</div>

    <script>
        // MODO OFFLINE
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    document.getElementById('estado-app').innerText = "✅ App lista para uso Offline";
                });
            });
        }

        // BASE DE DATOS
        let db;
        const request = indexedDB.open("InspeccionDB", 1);
        request.onupgradeneeded = (e) => { e.target.result.createObjectStore("registros", { keyPath: "id", autoIncrement:true }); };
        request.onsuccess = (e) => { db = e.target.result; };

        // GPS
        let latitudActual = null, longitudActual = null;
        document.getElementById('btn-ubicacion').addEventListener('click', () => {
            document.getElementById('coordenadas-texto').innerText = "Buscando... 🛰️";
            navigator.geolocation.getCurrentPosition((p) => {
                latitudActual = p.coords.latitude; longitudActual = p.coords.longitude;
                document.getElementById('coordenadas-texto').innerText = `Lat: ${latitudActual.toFixed(6)} | Lon: ${longitudActual.toFixed(6)}`;
            }, () => { alert("Error GPS"); }, { enableHighAccuracy: true });
        });

        // CÁMARA
        const video = document.getElementById('visor-camara'), canvas = document.getElementById('canvas-foto'),
              btnEncender = document.getElementById('btn-encender-camara'), btnCapturar = document.getElementById('btn-capturar-foto'),
              galeria = document.getElementById('galeria-miniaturas');
        let streamActual = null, fotosArray = [];

        btnEncender.addEventListener('click', async () => {
            streamActual = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            video.srcObject = streamActual; video.style.display = 'block'; btnCapturar.style.display = 'block'; btnEncender.style.display = 'none';
        });

        btnCapturar.addEventListener('click', () => {
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const foto = canvas.toDataURL('image/jpeg', 0.7);
            fotosArray.push(foto);
            const img = document.createElement('img'); img.src = foto; img.className = 'miniatura'; galeria.appendChild(img);
        });

        // GUARDAR
        document.getElementById('btn-guardar').addEventListener('click', () => {
            const t = document.getElementById('titulo').value;
            if(!latitudActual || !t) { alert("Faltan datos"); return; }
            const trans = db.transaction(["registros"], "readwrite");
            trans.objectStore("registros").add({ titulo: t, descripcion: document.getElementById('descripcion').value, latitud: latitudActual, longitud: longitudActual, fotos: fotosArray, fecha: new Date().toLocaleString() });
            trans.oncomplete = () => {
                alert("✅ Guardado");
                document.getElementById('titulo').value = ""; document.getElementById('descripcion').value = "";
                fotosArray = []; galeria.innerHTML = "";
            };
        });

        // DESCARGAR EXCEL (CSV) - Este nunca falla
        document.getElementById('btn-descargar-csv').addEventListener('click', () => {
            db.transaction("registros").objectStore("registros").getAll().onsuccess = (e) => {
                const res = e.target.result;
                if(res.length === 0) return alert("No hay datos");
                let csv = "ID,Titulo,Latitud,Longitud,Fecha\n";
                res.forEach(r => csv += `${r.id},${r.titulo},${r.latitud},${r.longitud},${r.fecha}\n`);
                const blob = new Blob([csv], {type: 'text/csv'});
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a"); a.href = url; a.download = "Datos.csv"; a.click();
            };
        });

        // COMPARTIR KMZ (Mejorado)
        document.getElementById('btn-compartir-kmz').addEventListener('click', async () => {
            db.transaction("registros").objectStore("registros").getAll().onsuccess = async (e) => {
                const res = e.target.result;
                if(res.length === 0) return alert("No hay datos");
                
                const zip = new JSZip();
                const imgFolder = zip.folder("images");
                let kml = `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Reporte</name>`;

                res.forEach(r => {
                    let html = `<div style="font-family:Arial;"><h3>${r.titulo}</h3><p>${r.descripcion}</p>`;
                    if(r.fotos) r.fotos.forEach((f, i) => {
                        const name = `p${r.id}_${i}.jpg`;
                        imgFolder.file(name, f.split(',')[1], {base64: true});
                        html += `<img src="images/${name}" width="300"><br>`;
                    });
                    html += `</div>`;
                    kml += `<Placemark><name>${r.titulo}</name><description><![CDATA[${html}]]></description><Point><coordinates>${r.longitud},${r.latitud}</coordinates></Point></Placemark>`;
                });
                kml += `</Document></kml>`;
                zip.file("doc.kml", kml);

                const content = await zip.generateAsync({type:"blob"});
                const fileKMZ = new File([content], "Reporte.kmz", {type: "application/vnd.google-earth.kmz"});

                // PRUEBA DE FUEGO PARA COMPARTIR
                if (navigator.share) {
                    try {
                        await navigator.share({
                            files: [fileKMZ],
                            title: 'Reporte de Inspección',
                            text: 'Envío reporte KMZ generado desde la App.'
                        });
                    } catch (err) {
                        // Si falla el compartir, hacemos descarga automática
                        const url = URL.createObjectURL(fileKMZ);
                        const a = document.createElement("a"); a.href = url; a.download = "Reporte.kmz"; a.click();
                        alert("El celular bloqueó el menú de compartir, pero el archivo se descargó en tu carpeta de Descargas.");
                    }
                } else {
                    const url = URL.createObjectURL(fileKMZ);
                    const a = document.createElement("a"); a.href = url; a.download = "Reporte.kmz"; a.click();
                }
            };
        });
    </script>
</body>
</html>
