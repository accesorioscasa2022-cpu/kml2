<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspección de Caminos</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; background-color: #f4f4f9;}
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333;}
        input[type="text"], textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px;}
        button { width: 100%; padding: 12px; background-color: #0056b3; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px;}
        button:active { background-color: #004494; }
        .btn-success { background-color: #28a745; }
        .btn-success:active { background-color: #218838; }
        .status { margin-top: 20px; padding: 10px; background-color: #e2e3e5; border-radius: 5px; text-align: center; font-weight: bold;}
    </style>
</head>
<body>
    <div class="card">
        <h2>Inspección en Campo</h2>

        <div class="form-group">
            <label for="titulo">Título del Punto:</label>
            <input type="text" id="titulo" placeholder="Ej. Km 2+500 - Fisuras en pavimento">
        </div>

        <div class="form-group">
            <label for="descripcion">Descripción / Notas:</label>
            <textarea id="descripcion" rows="3" placeholder="Observaciones del tramo..."></textarea>
        </div>

        <div class="form-group">
            <button id="btn-ubicacion">📍 Obtener Coordenadas GPS</button>
            <p id="coordenadas-texto" style="text-align: center; color: #666;">Latitud: --- | Longitud: ---</p>
        </div>

        <div class="form-group">
            <label>Fotos del Punto:</label>
            <input type="file" id="input-foto" accept="image/*" capture="environment" multiple>
        </div>

        <button id="btn-guardar" class="btn-success">💾 Guardar Registro (Local)</button>
    </div>

    <div class="status" id="estado-app">
        Conectando...
    </div>

    <script>
        // 1. MODO OFFLINE
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => {
                        document.getElementById('estado-app').innerText = "✅ App lista para uso Offline";
                        document.getElementById('estado-app').style.backgroundColor = "#d4edda";
                        document.getElementById('estado-app').style.color = "#155724";
                    })
                    .catch(err => {
                        document.getElementById('estado-app').innerText = "⚠️ Error al cargar modo Offline";
                    });
            });
        }

        // 2. CREAR BASE DE DATOS LOCAL
        let db;
        const request = indexedDB.open("InspeccionDB", 1);

        request.onupgradeneeded = function(event) {
            db = event.target.result;
            // Creamos la tabla donde se guardarán los datos de los caminos
            db.createObjectStore("registros", { keyPath: "id", autoIncrement:true });
        };

        request.onsuccess = function(event) {
            db = event.target.result;
        };

        // 3. ACTIVAR EL GPS (Funciona sin internet)
        let latitudActual = null;
        let longitudActual = null;

        document.getElementById('btn-ubicacion').addEventListener('click', () => {
            const textoCoordenadas = document.getElementById('coordenadas-texto');
            textoCoordenadas.innerText = "Buscando señal GPS... 🛰️";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    latitudActual = position.coords.latitude;
                    longitudActual = position.coords.longitude;
                    textoCoordenadas.innerText = `Latitud: ${latitudActual.toFixed(6)} | Longitud: ${longitudActual.toFixed(6)}`;
                },
                (error) => {
                    textoCoordenadas.innerText = "⚠️ Error: Activa el GPS y permite la ubicación.";
                },
                { enableHighAccuracy: true } // Fuerza el uso del hardware GPS del celular
            );
        });

        // 4. GUARDAR DATOS Y FOTOS EN EL CELULAR
        document.getElementById('btn-guardar').addEventListener('click', async () => {
            const titulo = document.getElementById('titulo').value;
            const descripcion = document.getElementById('descripcion').value;
            const inputFoto = document.getElementById('input-foto');
            
            if(!latitudActual || !longitudActual) {
                alert("Por favor, presiona el botón de 'Obtener Coordenadas GPS' primero.");
                return;
            }
            if(!titulo) {
                alert("Por favor, ponle un título al punto.");
                return;
            }

            // Convertir fotos a código para guardarlas en la base de datos
            const leerFotoComoBase64 = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = error => reject(error);
                    reader.readAsDataURL(file);
                });
            };

            let fotosArray = [];
            for (let i = 0; i < inputFoto.files.length; i++) {
                const base64 = await leerFotoComoBase64(inputFoto.files[i]);
                fotosArray.push(base64);
            }

            const nuevoRegistro = {
                titulo: titulo,
                descripcion: descripcion,
                latitud: latitudActual,
                longitud: longitudActual,
                fotos: fotosArray,
                fecha: new Date().toISOString()
            };

            const transaction = db.transaction(["registros"], "readwrite");
            const store = transaction.objectStore("registros");
            store.add(nuevoRegistro);

            transaction.oncomplete = function() {
                alert("✅ ¡Registro de inspección guardado correctamente en tu celular!");
                
                // Limpiar todo para capturar el siguiente punto en la ruta
                document.getElementById('titulo').value = "";
                document.getElementById('descripcion').value = "";
                document.getElementById('input-foto').value = "";
                latitudActual = null;
                longitudActual = null;
                document.getElementById('coordenadas-texto').innerText = "Latitud: --- | Longitud: ---";
            };
            
            transaction.onerror = function() {
                alert("⚠️ Error al guardar el registro.");
            };
        });
    </script>
</body>
</html>
