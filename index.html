<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inspección de Caminos</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --primary: #1e3a8a; --secondary: #2563eb; --accent: #f59e0b; --success: #10b981; --bg: #f3f4f6; --surface: #ffffff; --text-main: #1f2937; --text-muted: #6b7280; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; padding: 0; padding-bottom: 40px; }
        header { background-color: var(--primary); color: white; padding: 16px 20px; text-align: center; font-size: 1.2rem; font-weight: 600; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
        .container { padding: 20px; max-width: 600px; margin: auto; }
        .card { background: var(--surface); padding: 24px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 24px; }
        .card-title { margin-top: 0; font-size: 1.1rem; color: var(--primary); border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: var(--text-muted); }
        input[type="text"], textarea { width: 100%; padding: 14px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 10px; font-size: 1rem; background-color: #f9fafb; transition: all 0.3s ease; }
        input:focus, textarea:focus { outline: none; border-color: var(--secondary); background-color: white; box-shadow: 0 0 0 3px rgba(37,99,235,0.2); }
        button { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button:active { transform: scale(0.97); }
        .btn-outline { background: transparent; border: 2px solid var(--secondary); color: var(--secondary); }
        .btn-success { background-color: var(--success); color: white; }
        .btn-camara { background-color: #4b5563; color: white; }
        .btn-csv { background-color: var(--secondary); color: white; }
        .btn-kmz { background-color: var(--accent); color: white; }
        .btn-reset { background-color: transparent; border: 1px solid #ef4444; color: #ef4444; margin-top: 20px; font-size: 0.85rem; }
        .btn-descarga-lista { background-color: #10b981; color: white; display: block; text-align: center; text-decoration: none; padding: 14px; border-radius: 10px; font-weight: bold; animation: latido 1.5s infinite; }
        @keyframes latido { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        .coordenadas-box { background-color: #f3f4f6; padding: 12px; border-radius: 8px; text-align: center; font-size: 0.9rem; color: var(--text-muted); margin-top: 10px; border: 1px dashed #d1d5db; }
        #visor-camara { width: 100%; border-radius: 10px; background-color: #000; display: none; margin-bottom: 15px; }
        #galeria-miniaturas { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .miniatura { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; border: 2px solid var(--secondary); }
        .status { text-align: center; font-size: 0.85rem; color: var(--text-muted); margin-top: 20px;}
    </style>
</head>
<body>
    <header>Inspección en Campo</header>
    <div class="container">
        <div class="card">
            <h3 class="card-title">📝 Nuevo Registro</h3>
            <div class="form-group">
                <label for="titulo">Punto de Inspección</label>
                <input type="text" id="titulo" placeholder="Ej. Losa Km 12+500">
            </div>
            <div class="form-group">
                <label for="descripcion">Observaciones Generales</label>
                <textarea id="descripcion" rows="3" placeholder="Describe el estado general..."></textarea>
            </div>
            <div class="form-group">
                <button id="btn-ubicacion" class="btn-outline">📍 Capturar Coordenadas GPS</button>
                <div class="coordenadas-box" id="coordenadas-texto">Latitud: --- <br> Longitud: ---</div>
            </div>
            <div class="form-group">
                <video id="visor-camara" autoplay playsinline muted></video>
                <canvas id="canvas-foto" style="display: none;"></canvas>
                <button id="btn-encender-camara" class="btn-camara">📷 Abrir Cámara</button>
                <button id="btn-capturar-foto" style="background-color: #fbbf24; color: #000; display: none;">📸 Capturar Foto (y añadir pie)</button>
                <div id="galeria-miniaturas"></div>
            </div>
            <button id="btn-guardar" class="btn-success">💾 Guardar Registro</button>
        </div>

        <div class="card">
            <h3 class="card-title">📤 Exportar Datos</h3>
            <p style="font-size: 0.85rem; color: #6b7280; margin-bottom: 15px; margin-top: -10px;">
                Toca "Preparar". Cuando se ponga verde, tócalo de nuevo para descargarlo. Luego envíalo desde tu WhatsApp como Documento.
            </p>
            
            <div id="contenedor-csv" style="margin-bottom: 15px;">
                <button id="btn-preparar-csv" class="btn-csv">📊 1. Preparar Excel (CSV)</button>
            </div>
            
            <div id="contenedor-kmz">
                <button id="btn-preparar-kmz" class="btn-kmz">🌍 2. Preparar Reporte KMZ</button>
            </div>
        </div>

        <button id="btn-reset" class="btn-reset">🔄 Solucionar problemas de Cámara (Limpiar Memoria)</button>
        
        <div class="status" id="estado-app">Inicializando sistema...</div>
    </div>

    <script>
        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').then(reg => { document.getElementById('estado-app').innerText = "✅ Sistema Offline Activo"; }); }); }

        let db; const request = indexedDB.open("InspeccionDB", 1);
        request.onupgradeneeded = (e) => { e.target.result.createObjectStore("registros", { keyPath: "id", autoIncrement:true }); };
        request.onsuccess = (e) => { db = e.target.result; };

        let latitudActual = null, longitudActual = null;
        document.getElementById('btn-ubicacion').addEventListener('click', () => {
            document.getElementById('coordenadas-texto').innerHTML = "Buscando... 🛰️";
            navigator.geolocation.getCurrentPosition((p) => { latitudActual = p.coords.latitude; longitudActual = p.coords.longitude; document.getElementById('coordenadas-texto').innerHTML = `<b>Lat:</b> ${latitudActual.toFixed(6)} <br> <b>Lon:</b> ${longitudActual.toFixed(6)}`; }, () => { document.getElementById('coordenadas-texto').innerHTML = "⚠️ Error GPS."; }, { enableHighAccuracy: true });
        });

        const video = document.getElementById('visor-camara'), canvas = document.getElementById('canvas-foto'), btnEncender = document.getElementById('btn-encender-camara'), btnCapturar = document.getElementById('btn-capturar-foto'), galeria = document.getElementById('galeria-miniaturas');
        let streamActual = null, fotosArray = [];

        btnEncender.addEventListener('click', async () => {
            try { streamActual = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); video.srcObject = streamActual; video.style.display = 'block'; btnCapturar.style.display = 'flex'; btnEncender.style.display = 'none'; } catch (error) { alert("Error cámara"); }
        });

        btnCapturar.addEventListener('click', () => {
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const fotoBase64 = canvas.toDataURL('image/jpeg', 0.8);
            
            let pieDeFoto = prompt("Escribe un pie de foto para esta imagen:", "Ej: Grieta profunda");
            if (pieDeFoto === null || pieDeFoto.trim() === "") { pieDeFoto = "Sin pie de foto"; }
            
            fotosArray.push({ base64: fotoBase64, descripcion: pieDeFoto });
            
            const divContenedor = document.createElement('div'); divContenedor.style = "text-align: center; width: 75px;";
            const img = document.createElement('img'); img.src = fotoBase64; img.className = 'miniatura';
            const txt = document.createElement('div'); txt.innerText = pieDeFoto; txt.style = "font-size: 10px; color: #666; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;";
            divContenedor.appendChild(img); divContenedor.appendChild(txt); galeria.appendChild(divContenedor);
        });

        document.getElementById('btn-guardar').addEventListener('click', () => {
            const t = document.getElementById('titulo').value;
            if(!latitudActual || !t) { alert("Faltan coordenadas o título."); return; }
            const trans = db.transaction(["registros"], "readwrite");
            trans.objectStore("registros").add({ titulo: t, descripcion: document.getElementById('descripcion').value, latitud: latitudActual, longitud: longitudActual, fotos: fotosArray, fecha: new Date().toLocaleString() });
            trans.oncomplete = () => {
                alert("✅ Guardado en memoria"); document.getElementById('titulo').value = ""; document.getElementById('descripcion').value = ""; latitudActual = null; longitudActual = null; document.getElementById('coordenadas-texto').innerHTML = "Latitud: --- <br> Longitud: ---"; fotosArray = []; galeria.innerHTML = "";
                if(streamActual) { streamActual.getTracks().forEach(track => track.stop()); video.style.display = 'none'; btnCapturar.style.display = 'none'; btnEncender.style.display = 'flex'; }
                
                document.getElementById('contenedor-csv').innerHTML = '<button id="btn-preparar-csv" class="btn-csv">📊 1. Preparar Excel (CSV)</button>';
                document.getElementById('contenedor-kmz').innerHTML = '<button id="btn-preparar-kmz" class="btn-kmz">🌍 2. Preparar Reporte KMZ</button>';
                vincularBotones();
            };
        });

        function vincularBotones() {
            const btnCsv = document.getElementById('btn-preparar-csv');
            if(btnCsv) {
                btnCsv.addEventListener('click', () => {
                    db.transaction("registros").objectStore("registros").getAll().onsuccess = (e) => {
                        const res = e.target.result; if(res.length === 0) return alert("Base vacía.");
                        let csv = "ID,Titulo,Descripcion,Latitud,Longitud,Fecha\n";
                        res.forEach(r => { csv += `${r.id},${r.titulo.replace(/,/g," ")},${r.descripcion.replace(/,/g," ")},${r.latitud},${r.longitud},${r.fecha}\n`; });
                        
                        const archivo = new Blob([csv], { type: "text/csv" });
                        const url = URL.createObjectURL(archivo);
                        document.getElementById('contenedor-csv').innerHTML = `<a href="${url}" download="Datos_Inspeccion.csv" class="btn-descarga-lista">✅ 1. Toca aquí para Descargar Excel</a>`;
                    };
                });
            }

            const btnKmz = document.getElementById('btn-preparar-kmz');
            if(btnKmz) {
                btnKmz.addEventListener('click', async () => {
                    if (typeof JSZip === 'undefined') return alert("Cargando la herramienta ZIP, espera un momento...");
                    
                    db.transaction("registros").objectStore("registros").getAll().onsuccess = async (e) => {
                        const res = e.target.result; if(res.length === 0) return alert("Base vacía.");
                        
                        document.getElementById('btn-preparar-kmz').innerText = "⏳ Empaquetando fotos...";
                        
                        const zip = new JSZip(); const imgFolder = zip.folder("images");
                        let kml = `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Reporte</name>`;

                        res.forEach(r => {
                            let html = `<div style="font-family:Arial, sans-serif;"><h3 style="color:#1e3a8a; border-bottom:2px solid #f59e0b;">${r.titulo}</h3><p><b>Fecha:</b> ${r.fecha}<br><b>Coordenadas:</b> ${r.latitud}, ${r.longitud}</p><p style="background:#f3f4f6; padding:8px;">${r.descripcion}</p>`;
                            if(r.fotos) r.fotos.forEach((f, i) => {
                                const name = `foto_${r.id}_${i}.jpg`;
                                imgFolder.file(name, f.base64.split(',')[1], {base64: true});
                                html += `<div style="margin-top:15px; background:#fff; padding:10px; border-radius:8px; border: 1px solid #ccc; text-align:center;"><img src="images/${name}" style="width:100%; border-radius:4px;"><p style="margin: 8px 0 0 0; font-size: 14px; color: #444;"><i>📸 ${f.descripcion}</i></p></div>`;
                            });
                            html += `</div>`;
                            kml += `<Placemark><name>${r.titulo}</name><description><![CDATA[${html}]]></description><Point><coordinates>${r.longitud},${r.latitud}</coordinates></Point></Placemark>`;
                        });
                        kml += `</Document></kml>`; zip.file("doc.kml", kml);
                        
                        const content = await zip.generateAsync({type:"blob"});
                        
                        const url = URL.createObjectURL(content);
                        document.getElementById('contenedor-kmz').innerHTML = `<a href="${url}" download="Reporte_Campo.kmz" class="btn-descarga-lista">✅ 2. Toca aquí para Descargar KMZ</a>`;
                    };
                });
            }
        }
        vincularBotones();

        // FUNCIÓN DEL BOTÓN LIMPIADOR
        document.getElementById('btn-reset').addEventListener('click', () => {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(registrations) {
                    for(let registration of registrations) { registration.unregister(); }
                    alert("🧹 Memoria limpiada exitosamente.\n\nLa aplicación se recargará para arreglar la cámara.");
                    window.location.reload(true);
                });
            }
        });
    </script>
</body>
</html>
